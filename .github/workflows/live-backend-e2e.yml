name: Published Backend E2E
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify published Cloudflare Worker with synthetic assessment
        run: node scripts/live-smoke.mjs
        env:
          SKILLPRINT_LIVE_API: https://skillprint-live-api.hsdf7rb.workers.dev
