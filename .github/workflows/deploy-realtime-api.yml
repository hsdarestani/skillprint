name: Deploy SKILLPRINT Realtime API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/engine.js"
      - "src/guest.js"
      - "src/service-dialogue.js"
      - ".github/workflows/deploy-realtime-api.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy Worker and SQLite Durable Objects
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.toml
      - name: Smoke test live API
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo 'Cloudflare deployment URL not returned. Check Wrangler output.'
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$DEPLOYMENT_URL/api/health"
          echo
          echo "Live API: $DEPLOYMENT_URL"
      - name: Verify live AI hotel guest and event evidence
        env:
          SKILLPRINT_LIVE_API: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/live-ai-smoke.mjs
      - name: Verify staged hotel service interruptions and evidence rubrics
        env:
          SKILLPRINT_LIVE_API: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/live-multitask-smoke.mjs
      - name: Verify live Sofia and Housekeeping multilingual service conversations
        env:
          SKILLPRINT_LIVE_API: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/live-service-smoke.mjs
      - name: Verify Pencil evidence, learning and replay from published events
        env:
          SKILLPRINT_LIVE_API: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/live-evidence-smoke.mjs
