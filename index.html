<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080f19" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="SKILLPRINT LIVE — Evidenzbasierte Arbeitsproben statt Bauchgefühl." />
  <title>SKILLPRINT LIVE · Skill Assessment Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    html,body{margin:0;min-height:100%;background:#080f19;color:#f1f4f5;font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
    .boot-shell{min-height:100vh;display:grid;place-items:center;padding:22px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 25%,#1d3548 0%,#080f19 65%)}
    .boot-panel{width:min(100%,560px);background:#132334;border:1px solid #3c4e5b;border-radius:18px;padding:clamp(23px,5vw,44px);box-sizing:border-box;box-shadow:0 25px 90px #0004}
    .boot-kicker{color:#d1ad73;font-size:11px;font-weight:700;letter-spacing:.24em}
    .boot-panel h1{font-size:clamp(24px,4vw,38px);line-height:1.2;letter-spacing:-.05em;margin:22px 0}
    .boot-panel p{color:#a9b9c6;font-size:14px;margin:0 0 16px}
    .boot-status{font-size:12px;color:#7edac5;padding-top:16px;border-top:1px solid #3c4e5b}
    .boot-panel code{color:#e9ceaa;font-size:12px;overflow-wrap:anywhere}
    #boot-error-details{white-space:pre-wrap;font-size:12px;color:#ffa99f;margin-top:15px;overflow-wrap:anywhere}
  </style>
  <script>
    // A visible fallback even if Pages publishes raw source instead of the Vite dist/ folder.
    (function () {
      function failed(message) {
        var shell = document.getElementById("boot-shell");
        if (!shell) return;
        var heading = shell.querySelector("h1");
        var status = shell.querySelector(".boot-status");
        if (heading) heading.textContent = "Die Oberfläche konnte nicht gestartet werden.";
        if (status) {
          status.textContent = "Deploy-Einstellungen prüfen: Build command npm run build · Output directory dist";
          status.style.color = "#ffa99f";
        }
        var detail = document.getElementById("boot-error-details");
        if (detail) detail.textContent = message ? "Fehlerhinweis: " + String(message).slice(0,280) : "";
      }
      window.addEventListener("error", function (event) {
        if (event && event.target && event.target !== window && event.target.tagName === "SCRIPT") {
          failed("Ein JavaScript-Modul konnte nicht geladen werden.");
        } else {
          failed(event.message || "JavaScript-Laufzeitfehler");
        }
      }, true);
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason;
        failed(reason && reason.message ? reason.message : "Die Anwendung wurde nicht initialisiert.");
      });
      window.setTimeout(function () {
        var shell = document.getElementById("boot-shell");
        if (shell) failed("App-Start fehlgeschlagen oder gebaute Assets fehlen.");
      }, 6000);
    })();
  </script>
  <link rel="stylesheet" href="/src/style.css?v=sprint5-live-20261029" />
</head>
<body>
  <div id="app">
    <div class="boot-shell" id="boot-shell">
      <div class="boot-panel">
        <div class="boot-kicker">SKILLPRINT / LIVE</div>
        <h1>Das Assessment Studio wird vorbereitet.</h1>
        <p>Die interaktive Oberfläche wird geladen. Falls diese Meldung bestehen bleibt, sind wahrscheinlich die Cloudflare Pages Build-Einstellungen nicht korrekt.</p>
        <div class="boot-status">Verbindung zur Anwendung wird hergestellt …</div>
        <div id="boot-error-details" role="alert"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js?v=sprint5-live-20261029"></script>
</body>
</html>
