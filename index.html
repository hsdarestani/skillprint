<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f6f3" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="SKILLPRINT LIVE — Evidenzbasierte Arbeitsproben statt Bauchgefühl." />
  <title>SKILLPRINT LIVE · Skill Assessment Studio</title>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    html,body{margin:0;min-height:100%;background:#f6f6f3;color:#242528;font:15px/1.65 -apple-system,BlinkMacSystemFont,Inter,"Segoe UI",sans-serif}
    .boot-shell{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .boot-panel{width:min(100%,520px);padding:clamp(25px,5vw,42px);box-sizing:border-box}
    .boot-kicker{color:#245cd6;font-size:11px;font-weight:550;letter-spacing:.2em}
    .boot-panel h1{font-size:clamp(28px,4vw,40px);font-weight:500;line-height:1.14;letter-spacing:-.05em;margin:24px 0}
    .boot-panel p{color:#606875;font-size:13px;margin:0 0 20px;line-height:1.8}
    .boot-status{font-size:11px;color:#6d7c95;padding-top:20px;border-top:1px solid #dddfe3}
    .boot-panel code{color:#245cd6;font-size:12px;overflow-wrap:anywhere}
    #boot-error-details{white-space:pre-wrap;font-size:11px;color:#b0393f;margin-top:16px;overflow-wrap:anywhere}
  </style>
  <script>
    // A visible fallback even if Pages publishes raw source instead of the Vite dist/ folder.
    (function () {
      function failed(message) {
        var shell = document.getElementById("boot-shell");
        if (!shell) return;
        var heading = shell.querySelector("h1");
        var status = shell.querySelector(".boot-status");
        if (heading) heading.textContent = "Die Oberfläche konnte nicht gestartet werden.";
        if (status) {
          status.textContent = "Deploy-Einstellungen prüfen: Build command npm run build · Output directory dist";
          status.style.color = "#b0393f";
        }
        var detail = document.getElementById("boot-error-details");
        if (detail) detail.textContent = message ? "Fehlerhinweis: " + String(message).slice(0,280) : "";
      }
      window.addEventListener("error", function (event) {
        if (event && event.target && event.target !== window && event.target.tagName === "SCRIPT") {
          failed("Ein JavaScript-Modul konnte nicht geladen werden.");
        } else {
          failed(event.message || "JavaScript-Laufzeitfehler");
        }
      }, true);
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason;
        failed(reason && reason.message ? reason.message : "Die Anwendung wurde nicht initialisiert.");
      });
      window.setTimeout(function () {
        var shell = document.getElementById("boot-shell");
        if (shell) failed("App-Start fehlgeschlagen oder gebaute Assets fehlen.");
      }, 6000);
    })();
  </script>
  <link rel="stylesheet" href="/src/style.css?v=graphite-studio-20261030" />
</head>
<body>
  <div id="app">
    <div class="boot-shell" id="boot-shell">
      <div class="boot-panel">
        <div class="boot-kicker">SKILLPRINT / LIVE</div>
        <h1>Das Assessment Studio wird vorbereitet.</h1>
        <p>Ihre Arbeitsumgebung ist gleich bereit.</p>
        <div class="boot-status">Verbindung zur Anwendung wird hergestellt …</div>
        <div id="boot-error-details" role="alert"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js?v=graphite-studio-20261030"></script>
</body>
</html>
